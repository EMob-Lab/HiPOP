name: Continuous integration checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x' # The exact Python version is not important for linting and static analysis.

      - name: Build & install
        run: pip install --group dev .

      - name: Check file formatting (with pre-commit)
        run: pre-commit run --all-files

  build-and-test:
    name: Build & test (py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: # See https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - ubuntu-latest  # Arch: x64
          - windows-latest # Arch: x64
          - macos-latest   # Arch: arm64
        python-version:
          - '3.10' # Oldest supported version (must be kept consistent with the classifiers in `pyproject.toml`).
          - '3.14' # Most recent supported version (must be kept consistent with the classifiers in `pyproject.toml`).

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM OpenMP dev headers (Linux only)
        if: runner.os == 'Linux'
        # clang-tidy needs the LLVM OpenMP dev headers to process OpenMP-dependent code,
        # which are not available by default on the Linux runners.
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Install LLVM toolchain (macOS only)
        if: runner.os == 'macOS'
        # clang-tidy is not available by default on the macOS runners,
        # thus it must be installed separately to enable static analysis.
        # The environment variable CLANG_TIDY_ROOT is then exported for subsequent steps
        # (see script `cmake/ClangTidySettings.cmake`, which uses it as a search hint).
        run: |
          brew install llvm
          echo "CLANG_TIDY_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Install OpenMP (macOS only)
        if: runner.os == 'macOS'
        # AppleClang has no OpenMP by default, thus it must be installed separately.
        # The environment variable OpenMP_ROOT is then exported for subsequent steps
        # (CMake uses this variable as a search hint).
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: C++ core library - Configure
        run: cmake -S . -B build-cpponly -G Ninja -DHIPOP_USE_CLANG_TIDY_MANDATORY=ON

      - name: C++ core library - Build & static analysis
        run: cmake --build build-cpponly

      - name: C++ core library - Run tests
        run: ctest --test-dir build-cpponly --output-on-failure --no-tests=error

      - name: Python wrapper - Build & install
        run: pip install --group dev .

      - name: Python wrapper - Run tests
        run: pytest

  # This final job acts as a gate to ensure all the previous jobs have succeeded.
  # It is provided to be registered as a status check for pull requests.
  ci-passed:
    name: CI checks all OK
    runs-on: ubuntu-slim
    if: always()
    needs:
      - lint
      - build-and-test

    steps:
      - name: Ensure all CI jobs passed
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" != "success" ]]; then
              echo "At least one CI job did not succeed."
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
